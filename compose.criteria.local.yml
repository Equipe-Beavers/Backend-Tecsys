name: geomash-criteria-local
services:
  criteria-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geomash_criteria_test
      POSTGRES_USER: geomash_local
      POSTGRES_PASSWORD: geomash_local_test_only
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - criteria-local-data:/var/lib/postgresql/data
      - ../DER - Geomash.sql:/docker-entrypoint-initdb.d/001-der.sql:ro
      - ./database/local/002-criteria-seed.sql:/docker-entrypoint-initdb.d/002-criteria-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomash_local -d geomash_criteria_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  criteria-local-data:
